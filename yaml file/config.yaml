artifacts_root: artifacts # the root folder that contains the results of each pipeline step

# artifacts = produced results. artifacts are the files or folders generated by the pipeline

data_ingestion:  # download the data, saves it, and extracts the archive
  local_data_file: dataset/Diabetes_Dataset.zip # local path where the downloaded data will be stored.
  unzip_dir: artifacts/data_ingestion

data_validation:  # ensure that the data is valid
  #root_dir: artifacts/data_validation # indicates the working directory for the data validation step
  unzip_data_dir: artifacts/data_ingestion/diabetes_dataset.csv # indicates the folder where the data is located

data_transformation: # transform the data: feature selection methods (PCA, MI etc.)
  # root_dir:  artifacts/data_transformation
  list_feature_drop_file: artifacts/data_feature_reduction/list_feature_drop.txt 

model_trainer: # normalization, splits data into train, test and validation (validation set only ANN), training model and evaluation
  #root_dir: artifacts/model_trainer
  train_data_path: artifacts/model_trainer/train.csv # for XGBoost and SVM
  test_data_path: artifacts/model_trainer/test.csv # for XGBoost, SVM and ANN
  test_size_value_file: artifacts/model_trainer/test_size_value_file.txt  # for XGBoost and SVM

  train_data_ANN_path: artifacts/model_trainer/train_ANN.csv # for ANN: split the train data into train and validation datasets
  val_data_ANN_path: artifacts/model_trainer/val_ANN.csv # for ANN: we need validation data
  
  model_path: artifacts/model_trainer/model.joblib
  scaler_path: artifacts/model_trainer/scaler.joblib


