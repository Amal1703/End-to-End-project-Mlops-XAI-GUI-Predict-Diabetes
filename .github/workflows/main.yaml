# Add secrets to GitHub (Settings → Secrets and variables → Actions)

name: workflow (CI/CD - GCP) # Defines the name displayed in GitHub Actions

on:
  push:
    branches: # Each `git push origin main` to the `main` branch triggers the CI/CD pipeline and starts the Continuous Deployment process.
      - main
    paths-ignore: # Ignore changes that only affect the README.md file
      - 'README.md'

permissions:
  id-token: write # Allows GitHub Actions to request an OIDC token.
                  # Commonly used for cloud deployments (AWS, Azure, GCP).
                  # Instead of storing long-lived credentials (e.g., AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY),
                  # GitHub generates a secure temporary token to authenticate and deploy resources,
                  # such as pushing a Docker image or deploying an application to the cloud.

  contents: read # Read all files in the GitHub repository


jobs: # A workflow consists of multiple jobs
  integration: # Name of the first workflow job
    name: Continuous Integration  # Name of the CI pipeline step: verify that the code works correctly
    runs-on: ubuntu-latest # Defines the operating system of the virtual machine where the pipeline will run.
    steps: # Steps
      - name: Checkout Code
        uses: actions/checkout@v4 # uses: This is the official GitHub action that downloads all the code from the repository
                                  # and places it in the runner's working directory.
                                  # @v4: Specifies the version of the action (version 4).


# Runs a Linux command to display code quality issues.
 # Goal: detect: Syntax errors, Bad coding style & Unused variables
# Example:
# Writing if (x = 5) instead of if (x == 5).
 # A linter will detect this mistake and display an error message.                  
      - name: Lint code
        run: |
           pip install flake8            
           flake8 . --max-line-length=140  


      - name: Run unit tests
        run: echo "Running unit tests" # Does not run the tests. It only displays the message "Running unit tests"
                                       # in the GitHub Actions terminal.
                                       # run: pytest runs the unit tests.

  build-and-push-image: # Name of the second workflow job
    name: Continuous Delivery  # CD = Build a Docker image and push it to Amazon ECR
    needs: integration  # If the "integration" job fails, the CD job will not start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip 
      - name: Authentication Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID  }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet
 
      - name: Build, tag and push Docker image in Artifact Registry
        id: build-image
        run: |
          docker build -t ${{ secrets.GCP_REGION}}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID  }}/${{ secrets.GCP_ARTIFACT_REGISTRY}}/${{ secrets.GCP_IMAGE_NAME }}:latest .
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID  }}/${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_IMAGE_NAME }}:latest

          
  Continuous-Deployment: # Name of the third workflow job
    needs: build-and-push-image # For each new version of the application, GitHub downloads the latest Docker image, automatically runs it and cleans up the old resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authentication Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
 
      - name: Configure gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID  }}
 
      - name: Deploy in Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCP_SERVICE_NAME }} \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID  }}/${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_IMAGE_NAME }}:latest \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --memory=1Gi \
            --max-instances=1
